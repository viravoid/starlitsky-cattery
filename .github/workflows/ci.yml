name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      WECHAT_MOCK_LOGIN_ENABLED: "true"
      WECHAT_MOCK_QR_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Install
        run: npm exec --yes --package bun@1.3.14 -- bun install --frozen-lockfile

      - name: Typecheck root
        run: npm run typecheck

      - name: Typecheck shared
        run: npm run typecheck:shared

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Typecheck miniapp
        run: npm run typecheck:miniapp

      - name: Typecheck admin
        run: npm run typecheck:admin

      - name: Build demo
        run: npm run build

      - name: Build admin
        run: npm run build:admin

      - name: Prisma validate
        run: npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api db:validate

      - name: Prisma generate
        run: npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api db:generate

      - name: Prisma migrate diff
        run: |
          rm -f services/api/prisma/ci-shadow.db services/api/prisma/ci-shadow.db-*
          npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url file:./ci-shadow.db \
            --script

      - name: Prisma migrate deploy fresh SQLite
        env:
          DATABASE_URL: file:./ci-migrate.db
        run: |
          rm -f services/api/prisma/ci-migrate.db services/api/prisma/ci-migrate.db-*
          npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api db:migrate:deploy
          npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api verify:migration-smoke

      - name: Verify community
        run: npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api verify:community

      - name: Verify media upload integrity
        run: npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api verify:media-upload

      - name: Verify security
        run: npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api verify:security

      - name: Verify admin auth
        run: npm exec --yes --package bun@1.3.14 -- bun run --cwd services/api verify:admin-auth

      - name: Verify production env
        env:
          NODE_ENV: production
          API_HOST: 127.0.0.1
          API_PORT: 8080
          DATABASE_URL: file:./ci-production-env.db
          AUTH_TOKEN_SECRET: ci-release-readiness-production-secret-32-chars
          WECHAT_APP_ID: wxcirelease1234567890
          WECHAT_APP_SECRET: ci-wechat-secret-release-readiness-32-chars
          WECHAT_MOCK_LOGIN_ENABLED: "false"
          WECHAT_MOCK_QR_ENABLED: "false"
          CORS_ALLOWED_ORIGINS: https://admin.staging.starlitsky.example.org
          STORAGE_PROVIDER: cos
          STORAGE_BUCKET: starlitsky-ci-media
          STORAGE_REGION: ap-shanghai
          STORAGE_ACCESS_KEY_ID: ci-storage-access-key
          STORAGE_ACCESS_KEY_SECRET: ci-storage-secret-release-readiness-32-chars
          STORAGE_PUBLIC_BASE_URL: https://media.staging.starlitsky.example.org
        run: npm run verify:production-env

      - name: Verify deployment assets
        run: |
          npm run verify:deployment-assets
          bash -n deploy/production/scripts/*.sh

      - name: API npm audit
        run: |
          for attempt in 1 2 3; do
            if npm --prefix services/api audit --audit-level=high; then
              exit 0
            fi
            status=$?
            echo "npm audit attempt ${attempt} failed with exit code ${status}"
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 20))
          done

      - name: Diff check
        run: git diff --check
